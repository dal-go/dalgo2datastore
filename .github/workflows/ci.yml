name: Go CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  go_ci:
    uses: strongo/cicd/.github/workflows/workflow.yml@b9bc69e5e3c3123956fc82a41d393cdd0cb23cbf # v1.25.5
    permissions:
      contents: write
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      go_version: '1.27.4'
      build_command: |
        set -euo pipefail
        export JAVA_HOME="${JAVA_HOME_25_X64:?Datastore emulator requires Java 25}"
        export PATH="$JAVA_HOME/bin:$PATH"
        printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"

        # The hosted image already has gcloud, but removes the apt source
        # used to install it. Restore that source for the emulator component.
        keyring="$RUNNER_TEMP/google-cloud-sdk.gpg"
        curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg |
          gpg --dearmor --output "$keyring"
        sudo install -m 0644 "$keyring" /usr/share/keyrings/cloud.google.gpg
        printf 'deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main\n' |
          sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends google-cloud-cli-datastore-emulator
        gcloud version
        gcloud beta emulators datastore start --help >/dev/null
        go vet ./...
